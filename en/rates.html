<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pricing | Code4All</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../style/sidebar.css">
    <link rel="stylesheet" href="../style/mainstyles.css">
</head>
<body>
    <nav class="navbar d-md-none bg-light border-bottom px-3 sticky-top">
        <button class="btn btn-outline-dark" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
            <i class="bi-list fs-4"></i>
        </button>
        <a href="index.html" class="navbar-brand ms-2">
            <img src="../img/logo_c4a.png" style="max-height: 40px;">
        </a>
    </nav>

    <div class="container-fluid">
        <div class="row flex-nowrap">

            <!-- Sidebar -->
            <div class="offcanvas-md offcanvas-start col-md-3 col-xl-2 px-sm-2 px-0 bg-light" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
                <div class="offcanvas-header d-md-none">
                    <h5 class="offcanvas-title" id="sidebarMenuLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-black min-vh-100 sticky-top">
                    <!-- Language selector -->
                    <div id="lang-cont" class="mb-3">
                        <label id="lang-label" for="language">Language</label>
                        <select id="language" class="form-select form-select-sm w-auto">
                            <option value="pl">Polski</option>
                            <option value="en" selected>English</option>
                            <option value="de">Deutsch</option>
                            <option value="fr">Français</option>
                        </select>
                    </div>
                    <div class="d-flex flex-column align-items-center align-items-sm-start pb-3 mb-3">
                        <a href="index.html">
                            <img src="../img/logo_c4a.png" class="img-fluid mb-2" style="max-height: 70px;">
                        </a>
                        <a href="index.html" class="navbar-brand border fs-5 text-center text-sm-start px-3 py-1">
                            <span class="bg-dark text-white">Czarno</span> na białym
                        </a>
                    </div>
                    <ul class="nav nav-pills flex-column w-100" id="menu">
                        <li class="nav-item w-100 mb-1"><a href="index.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-house"></i> <span class="ms-1">Home</span></a></li>
                        <li class="nav-item w-100 mb-1"><a href="contact.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-telephone-outbound"></i> <span class="ms-1">Contact</span></a></li>
                        <li class="nav-item w-100 mb-1"><a href="about.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-person-raised-hand"></i> <span class="ms-1">About Me</span></a></li>
                        <li class="nav-item w-100 mb-1"><a href="portfolio.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-git"></i> <span class="ms-1">Portfolio</span></a></li>
                        <li class="nav-item w-100"><a href="rates.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill active"><i class="fs-4 bi-coin"></i> <span class="ms-1">Pricing</span></a></li>
                    </ul>
                </div>
            </div>

            <!-- Pricing content -->
            <div class="col py-4 px-5">
                <div class="row my-5 text-center">
                    <div class="col">
                        <div class="badge text-bg-dark fs-1 fw-bold">Pricing</div>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8">
                        <table class="table table-bordered table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>No.</th>
                                    <th>Service</th>
                                    <th>Price</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td>Hourly rate</td>
                                    <td><strong>30 PLN</strong></td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td>WordPress setup (with ready-made content)</td>
                                    <td>3-8 hrs (90-240 PLN)</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <footer class="text-center mt-5">Copyright © 2023-2025 Kamil Szwaradzki</footer>
            </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
