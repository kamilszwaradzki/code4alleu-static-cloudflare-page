<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cennik | Code4All</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="style/sidebar.css">

<body>

        <div class="row flex-nowrap">

            <div class="d-none d-md-block col-md-3 col-xl-2 px-sm-2 px-0 bg-light">
                <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-black min-vh-100 sticky-top">
                    <!-- Selektor języka -->
                    <div id="lang-cont" class="mb-3">
                        <label id="lang-label" for="language">Język</label>
                        <select id="language" class="form-select form-select-sm w-auto">
                            <option value="pl" selected>Polski</option>
                            <option value="en">English</option>
                            <option value="de">Deutsch</option>
                            <option value="fr">Français</option>

                    </div>
                    <div class="d-flex flex-column align-items-center align-items-sm-start pb-3 mb-3">

                        </a>
                        <a href="index.html" class="navbar-brand border fs-5 text-center text-sm-start px-3 py-1">
                            <span class="bg-dark text-white">Czarno</span> na białym
                        </a>
                    </div>
                    <ul class="nav nav-pills flex-column w-100" id="menu">
                        <li class="nav-item w-100 mb-1"><a href="index.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-house"></i> <span class="ms-1 d-none d-sm-inline">Home</span></a></li>
                        <li class="nav-item w-100 mb-1"><a href="contact.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-telephone-outbound"></i> <span class="ms-1 d-none d-sm-inline">Kontakt</span></a></li>
                        <li class="nav-item w-100 mb-1"><a href="about.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-person-raised-hand"></i> <span class="ms-1 d-none d-sm-inline">O mnie</span></a></li>
                        <li class="nav-item w-100 mb-1"><a href="portfolio.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-git"></i> <span class="ms-1 d-none d-sm-inline">Realizacje</span></a></li>
                        <li class="nav-item w-100"><a href="rates.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill active"><i class="fs-4 bi-coin"></i> <span class="ms-1 d-none d-sm-inline">Cennik</span></a></li>
                    </ul>
                </div>
            </div>

            <!-- Treść cennik -->
            <div class="col py-4 px-5">
                <div class="row my-5 text-center">
                    <div class="col">
                        <div class="badge text-bg-dark fs-1 fw-bold">Cennik</div>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8">
                        <table class="table table-bordered table-hover">
                            <thead class="table-dark">
                                <tr>
                                    <th>Lp.</th>
                                    <th>Nazwa usługi</th>
                                    <th>Cena</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>1</td>
                                    <td>Godzina pracy</td>
                                    <td><strong>30 zł</strong></td>
                                </tr>
                                <tr>
                                    <td>2</td>
                                    <td>Postawienie WordPressa (z gotowymi treściami)</td>
                                    <td>3-8 godz.</td>
                                </tr>
                            </tbody>
                        </table>

                <footer class="text-center mt-5">Copyright © 2023-2025 Kamil Szwaradzki</footer>
