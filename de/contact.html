<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kontakt | Code4All</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../style/sidebar.css">
    <link rel="stylesheet" href="../style/mainstyles.css">
    <link rel="stylesheet" href="../style/contact.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row flex-nowrap">

            <!-- Sidebar -->
            <div class="d-none d-md-block col-md-3 col-xl-2 px-sm-2 px-0 bg-light">
                <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-black min-vh-100 sticky-top">
                    <!-- Sprachauswahl -->
                    <div id="lang-cont" class="mb-3">
                        <label id="lang-label" for="language">Sprache</label>
                        <select id="language" class="form-select form-select-sm w-auto">
                            <option value="pl">Polski</option>
                            <option value="en">English</option>
                            <option value="de" selected>Deutsch</option>
                            <option value="fr">Français</option>
                        </select>
                    </div>
                    <div class="d-flex flex-column align-items-center align-items-sm-start pb-3 mb-3">
                        <a href="index.html">
                            <img src="../img/logo_c4a.png" class="img-fluid mb-2" style="max-height: 70px;">
                        </a>
                        <a href="index.html" class="navbar-brand border fs-5 text-center text-sm-start px-3 py-1">
                            <span class="bg-dark text-white">Czarno</span> na białym
                        </a>
                    </div>
                    <ul class="nav nav-pills flex-column w-100" id="menu">
                        <li class="nav-item w-100 mb-1"><a href="index.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-house"></i> <span class="ms-1 d-none d-sm-inline">Start</span></a></li>
                        <li class="nav-item w-100 mb-1"><a href="contact.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill active"><i class="fs-4 bi-telephone-outbound"></i> <span class="ms-1 d-none d-sm-inline">Kontakt</span></a></li>
                        <li class="nav-item w-100 mb-1"><a href="about.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-person-raised-hand"></i> <span class="ms-1 d-none d-sm-inline">Über mich</span></a></li>
                        <li class="nav-item w-100 mb-1"><a href="portfolio.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-git"></i> <span class="ms-1 d-none d-sm-inline">Portfolio</span></a></li>
                        <li class="nav-item w-100"><a href="rates.html" class="btn btn-outline-dark fs-4 border-0 px-2 w-100 text-start rounded-pill"><i class="fs-4 bi-coin"></i> <span class="ms-1 d-none d-sm-inline">Preise</span></a></li>
                    </ul>
                </div>
            </div>

            <!-- Kontaktinhalt -->
            <div class="col py-4 px-5">
                <div class="row my-5 text-center">
                    <div class="col">
                        <div class="badge text-bg-dark fs-1 fw-bold">Kontakt aufnehmen</div>
                    </div>
                </div>
                <div class="row justify-content-center">
                    <div class="col-12 col-md-6">
                        <form id="contact-form">
                            <div class="mb-3">
                                <label class="form-label">Name / Firmenname</label>
                                <input type="text" name="name" class="form-control" placeholder="Dein Name oder Firmenname" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">E-Mail</label>
                                <input type="email" name="email" class="form-control" placeholder="Deine E-Mail-Adresse" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nachricht</label>
                                <textarea name="message" class="form-control" rows="6" placeholder="Was möchtest du mir mitteilen..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-dark btn-lg">Nachricht senden</button>
                        </form>
                    </div>
                </div>
                <footer class="text-center mt-5">Copyright © 2023-2025 Kamil Szwaradzki</footer>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
